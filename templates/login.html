{% extends 'base.html' %}

{% block title %} Login - ATM Digital Banking {% endblock %}
{% block extracss%}
<link rel="stylesheet" href="../static/css/dashboard.css">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <h1>Login to the ATM</h1>
    
   

    <form method="post">
        <label for="email">Enter your Email</label>
        <input type="email" name="email" placeholder="name@example.com" value="Hemanth@gmail.com" required autofocus>

        <label for="pin">Enter your 6-Digit PIN</label>
        <input type="password" name="pin" placeholder="Enter PIN (e.g. 234567)" maxlength="6" value="234567" required>

        <input type="submit" value="Login to ATM">
    </form>

    {% if info %}
    <h3>{{info}}</h3>
    {% endif %}

    <p><a href="/forgotpin">Forgot PIN?</a></p>
    <p>New User? <a href="/register">Register New Account</a></p>
</div>
{% endblock %}
